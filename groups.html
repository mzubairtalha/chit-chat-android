<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Groups - Chit Chat</title>
<style>
:root{
  --navy:#0369A1;--navy2:#0284C7;--purple:#0EA5E9;
  --bg:#F0F9FF;--card:#FFFFFF;--border:#BAE6FD;
  --t1:#0C1A2E;--t2:#4B6280;--t3:#94A3B8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
#gRoot{display:flex;flex-direction:column;height:100%;height:100dvh;}
#gHeader{
  flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;box-shadow:0 3px 16px rgba(3,105,161,0.30);
}
#gBackBtn,#gNewBtn{
  background:rgba(255,255,255,0.15);border:none;color:#fff;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;flex-shrink:0;
}
#gHeaderText{flex:1;min-width:0;}
#gTitle{font-size:16px;font-weight:700;line-height:1.25;}
#gSubtitle{font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:1px;}
.panel{display:none;flex-direction:column;flex:1;min-height:0;}
.panel.active{display:flex;}
#gList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 16px;}
.g-empty{text-align:center;color:var(--t3);font-size:13px;padding:48px 20px;}
.g-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:var(--card);border-bottom:1px solid var(--border);cursor:pointer;
}
.g-avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--navy),var(--purple));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
}
.g-meta{flex:1;min-width:0;}
.g-name{font-size:15px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-last{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.g-unread{
  min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ef4444;color:#fff;
  font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;
}
#gCreateBody{flex:1;overflow-y:auto;padding:14px;}
.g-label{font-size:12px;font-weight:700;color:var(--t2);margin:10px 0 6px;}
.g-input{
  width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;
  font-size:14px;background:#fff;color:var(--t1);outline:none;
}
.g-chipwrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.g-chip{background:#E0F2FE;color:#0369A1;border-radius:14px;padding:5px 10px;font-size:12px;font-weight:700;}
.g-chip button{border:none;background:none;color:#0369A1;font-weight:800;margin-left:4px;cursor:pointer;}
.g-btn{
  width:100%;margin-top:16px;border:none;border-radius:12px;padding:13px;
  background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;font-weight:700;font-size:15px;cursor:pointer;
}
.g-btn:disabled{opacity:.5;}
#gMessages{flex:1;overflow-y:auto;padding:14px 12px 10px;min-height:0;}
.gc-row{display:flex;flex-direction:column;max-width:78%;margin-bottom:10px;}
.gc-row.me{margin-left:auto;align-items:flex-end;}
.gc-row.other{margin-right:auto;align-items:flex-start;}
.gc-name{font-size:11.5px;font-weight:700;margin:0 4px 3px;}
.gc-bubble{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap;}
.gc-row.me .gc-bubble{background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;border-bottom-right-radius:4px;}
.gc-row.other .gc-bubble{background:var(--card);color:var(--t1);border:1px solid var(--border);border-bottom-left-radius:4px;}
.gc-time{font-size:10px;color:var(--t3);margin:3px 4px 0;}
#gInputRow{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--card);border-top:1px solid var(--border);
}
#gInput{
  flex:1;border:1.5px solid var(--border);border-radius:22px;padding:10px 16px;
  font-size:14px;background:#F8FAFC;color:var(--t1);outline:none;resize:none;max-height:90px;
}
#gSendBtn{
  flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;font-size:18px;cursor:pointer;
}
#gStatus{flex-shrink:0;text-align:center;font-size:11px;color:#b91c1c;padding:6px;display:none;}
.loading-spinner{
  display:inline-block;width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(3,105,161,0.25);border-top-color:var(--navy);
  animation:gspin .7s linear infinite;vertical-align:middle;margin-right:6px;
}
@keyframes gspin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="gRoot">
  <div id="gHeader">
    <button id="gBackBtn" title="Back">←</button>
    <div id="gHeaderText">
      <div id="gTitle">Groups</div>
      <div id="gSubtitle">Create or open a group chat</div>
    </div>
    <button id="gNewBtn" title="New group">+</button>
  </div>

  <div id="listPanel" class="panel active">
    <div id="gList"><div class="g-empty"><span class="loading-spinner"></span>Loading groups...</div></div>
  </div>

  <div id="createPanel" class="panel">
    <div id="gCreateBody">
      <div class="g-label">Group name</div>
      <input class="g-input" id="gNameInput" maxlength="40" placeholder="e.g. Friends">
      <div class="g-label">Add member by username</div>
      <input class="g-input" id="gMemberInput" maxlength="32" placeholder="Type username then Add">
      <button class="g-btn" id="gAddMemberBtn" type="button" style="margin-top:8px;">Add member</button>
      <div class="g-chipwrap" id="gChips"></div>
      <button class="g-btn" id="gCreateBtn" type="button">Create group</button>
    </div>
  </div>

  <div id="chatPanel" class="panel">
    <div id="gMessages"><div class="g-empty"><span class="loading-spinner"></span>Loading messages...</div></div>
    <div id="gStatus"></div>
    <div id="gInputRow">
      <textarea id="gInput" rows="1" maxlength="500" placeholder="Message..."></textarea>
      <button id="gSendBtn">➤</button>
    </div>
  </div>
</div>

<script src="js/firebase-app.js"></script>
<script src="js/firebase-database.js"></script>
<script src="js/firebase-auth.js"></script>
<script>
(function(){
"use strict";
var firebaseConfig={
apiKey:"AIzaSyBiiVHsi_vdIR9w2wyTvQMpCXMltVGTAsM",
authDomain:"chit-chat-84a92.firebaseapp.com",
databaseURL:"https://chit-chat-84a92-default-rtdb.firebaseio.com",
projectId:"chit-chat-84a92",
storageBucket:"chit-chat-84a92.firebasestorage.app",
messagingSenderId:"435993972654",
appId:"1:435993972654:web:5c9a5af5dc60628693823f",
measurementId:"G-HVQG8SQVG1"
};
if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var myUid=localStorage.getItem("uid")||null;
var myUsername=localStorage.getItem("username")||"User";
var embedded=false;
try{embedded=(window.self!==window.top);}catch(e){embedded=true;}

var listPanel=document.getElementById("listPanel");
var createPanel=document.getElementById("createPanel");
var chatPanel=document.getElementById("chatPanel");
var gList=document.getElementById("gList");
var gTitle=document.getElementById("gTitle");
var gSubtitle=document.getElementById("gSubtitle");
var gBackBtn=document.getElementById("gBackBtn");
var gNewBtn=document.getElementById("gNewBtn");
var gMessages=document.getElementById("gMessages");
var gInput=document.getElementById("gInput");
var gSendBtn=document.getElementById("gSendBtn");
var gStatus=document.getElementById("gStatus");
var gNameInput=document.getElementById("gNameInput");
var gMemberInput=document.getElementById("gMemberInput");
var gChips=document.getElementById("gChips");
var pendingMembers={};
var currentGroupId=null;
var currentGroupName="";
var msgRef=null;
var renderedKeys={};
var view="list";

function showStatus(t){
gStatus.style.display="block";
gStatus.textContent=t||"";
setTimeout(function(){gStatus.style.display="none";},2800);
}
function initial(name){
var s=String(name||"G").trim();
return (s.charAt(0)||"G").toUpperCase();
}
function formatTime(ts){
if(!ts)return "";
var d=new Date(ts);
var h=d.getHours(),m=d.getMinutes();
var ampm=h>=12?"PM":"AM";
h=h%12;if(h===0)h=12;
return h+":"+(m<10?"0"+m:m)+" "+ampm;
}
function setView(name,title,sub){
view=name;
listPanel.classList.toggle("active",name==="list");
createPanel.classList.toggle("active",name==="create");
chatPanel.classList.toggle("active",name==="chat");
gTitle.textContent=title||"Groups";
gSubtitle.textContent=sub||"";
gNewBtn.style.display=name==="list"?"flex":"none";
gBackBtn.style.display=(embedded&&name==="list")?"none":"flex";
}
if(embedded)gBackBtn.style.display="none";

function detachChat(){
if(msgRef){try{msgRef.off();}catch(e){}}
msgRef=null;
currentGroupId=null;
renderedKeys={};
}

function goList(){
detachChat();
setView("list","Groups","Create or open a group chat");
}

function renderGroupRow(id,g){
var row=document.createElement("div");
row.className="g-row";
row.dataset.id=id;
var av=document.createElement("div");
av.className="g-avatar";
av.textContent=initial(g.name);
var meta=document.createElement("div");
meta.className="g-meta";
var nm=document.createElement("div");
nm.className="g-name";
nm.textContent=g.name||"Group";
var last=document.createElement("div");
last.className="g-last";
last.textContent=g.lastMessage||"No messages yet";
meta.appendChild(nm);meta.appendChild(last);
var badge=document.createElement("div");
badge.className="g-unread";
var n=g.unreadCount||0;
if(n>0){badge.style.display="flex";badge.textContent=n>99?"99+":String(n);}
row.appendChild(av);row.appendChild(meta);row.appendChild(badge);
row.onclick=function(){openGroup(id,g.name||"Group");};
return row;
}

function loadGroups(){
if(!myUid){
gList.innerHTML='<div class="g-empty">Log in to Chit Chat to use groups.</div>';
return;
}
db.ref("userGroups/"+myUid).on("value",function(snap){
var data=snap.val()||{};
var ids=Object.keys(data);
if(!ids.length){
gList.innerHTML='<div class="g-empty">No groups yet. Tap + to create one.</div>';
return;
}
ids.sort(function(a,b){return (data[b].lastMessageTime||0)-(data[a].lastMessageTime||0);});
gList.innerHTML="";
ids.forEach(function(id){gList.appendChild(renderGroupRow(id,data[id]||{}));});
});
}

function renderChips(){
gChips.innerHTML="";
Object.keys(pendingMembers).forEach(function(uid){
var chip=document.createElement("span");
chip.className="g-chip";
chip.textContent=pendingMembers[uid];
var x=document.createElement("button");
x.type="button";x.textContent="x";
x.onclick=function(){delete pendingMembers[uid];renderChips();};
chip.appendChild(x);
gChips.appendChild(chip);
});
}

function lookupUsername(name,cb){
var raw=String(name||"").trim();
if(!raw){cb(null,null);return;}
db.ref("usernameIndex/"+raw.toLowerCase()).once("value",function(s){
var uid=s.val();
if(uid){cb(uid,raw);return;}
db.ref("usernames/"+raw).once("value",function(s2){
cb(s2.val()||null,raw);
});
});
}

document.getElementById("gAddMemberBtn").onclick=function(){
var name=gMemberInput.value.trim();
if(!name)return;
lookupUsername(name,function(uid){
if(!uid){showStatus("User not found");return;}
if(uid===myUid){showStatus("You are already in the group");return;}
pendingMembers[uid]=name;
gMemberInput.value="";
renderChips();
});
};

document.getElementById("gCreateBtn").onclick=function(){
var name=gNameInput.value.trim();
if(!name){showStatus("Enter a group name");return;}
if(!myUid){showStatus("Please log in first");return;}
var btn=document.getElementById("gCreateBtn");
btn.disabled=true;
var ref=db.ref("groups").push();
var gid=ref.key;
var members={};members[myUid]=true;
Object.keys(pendingMembers).forEach(function(u){members[u]=true;});
var now=Date.now();
var payload={name:name,createdBy:myUid,createdAt:now,members:members,icon:"icons/default.png"};
ref.set(payload).then(function(){
var jobs=[];
Object.keys(members).forEach(function(u){
jobs.push(db.ref("userGroups/"+u+"/"+gid).set({
name:name,icon:"icons/default.png",lastMessage:"Group created",lastMessageTime:now,unreadCount:u===myUid?0:1
}));
});
return Promise.all(jobs);
}).then(function(){
gNameInput.value="";
pendingMembers={};
renderChips();
btn.disabled=false;
openGroup(gid,name);
}).catch(function(){
btn.disabled=false;
showStatus("Could not create group");
});
};

function isNearBottom(){
return (gMessages.scrollHeight-gMessages.scrollTop-gMessages.clientHeight)<120;
}
function renderMsg(key,data,forceScroll){
if(renderedKeys[key])return;
renderedKeys[key]=true;
if(gMessages.querySelector(".g-empty"))gMessages.innerHTML="";
var isMe=!!(myUid&&data.uid===myUid);
var row=document.createElement("div");
row.className="gc-row "+(isMe?"me":"other");
if(!isMe){
var n=document.createElement("div");
n.className="gc-name";
n.textContent=data.username||"User";
row.appendChild(n);
}
var b=document.createElement("div");
b.className="gc-bubble";
b.textContent=data.message||"";
row.appendChild(b);
var t=document.createElement("div");
t.className="gc-time";
t.textContent=formatTime(data.timestamp);
row.appendChild(t);
var near=isNearBottom();
gMessages.appendChild(row);
if(forceScroll||near)gMessages.scrollTop=gMessages.scrollHeight;
}

function openGroup(id,name){
detachChat();
currentGroupId=id;
currentGroupName=name||"Group";
renderedKeys={};
gMessages.innerHTML='<div class="g-empty"><span class="loading-spinner"></span>Loading messages...</div>';
setView("chat",currentGroupName,"Group chat");
if(myUid)db.ref("userGroups/"+myUid+"/"+id).update({unreadCount:0,lastReadAt:Date.now()}).catch(function(){});
msgRef=db.ref("groupMessages/"+id).orderByChild("timestamp").limitToLast(100);
msgRef.on("child_added",function(snap){
renderMsg(snap.key,snap.val()||{},false);
});
msgRef.once("value",function(snap){
if(!snap.exists())gMessages.innerHTML='<div class="g-empty">No messages yet — say hi.</div>';
gMessages.scrollTop=gMessages.scrollHeight;
});
}

var sending=false;
function sendMessage(){
if(sending||!currentGroupId)return;
var text=(gInput.value||"").trim();
if(!text)return;
if(!myUid){showStatus("Please log in first");return;}
sending=true;gSendBtn.disabled=true;
var now=Date.now();
db.ref("groupMessages/"+currentGroupId).push({
uid:myUid,username:myUsername||"User",message:text.substring(0,500),timestamp:now
}).then(function(){
gInput.value="";gInput.style.height="auto";
return db.ref("groups/"+currentGroupId+"/members").once("value");
}).then(function(snap){
var members=snap.val()||{};
var jobs=[];
Object.keys(members).forEach(function(u){
var patch={lastMessage:text.substring(0,80),lastMessageTime:now,name:currentGroupName};
if(u!==myUid)patch.unreadCount=firebase.database.ServerValue.increment(1);
else patch.unreadCount=0;
jobs.push(db.ref("userGroups/"+u+"/"+currentGroupId).update(patch));
});
return Promise.all(jobs);
}).catch(function(){
showStatus("Message failed");
}).then(function(){
sending=false;gSendBtn.disabled=false;gInput.focus();
});
}

gSendBtn.onclick=sendMessage;
gInput.addEventListener("keydown",function(e){
if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
gInput.addEventListener("input",function(){
gInput.style.height="auto";
gInput.style.height=Math.min(gInput.scrollHeight,90)+"px";
});

gNewBtn.onclick=function(){
pendingMembers={};renderChips();gNameInput.value="";
setView("create","New group","Add members by username");
};
gBackBtn.onclick=function(){
if(view==="chat"||view==="create")goList();
else if(!embedded)window.location.href="index.html";
};

loadGroups();
try{
var openId=localStorage.getItem("openGroupOnLoad");
if(openId){
localStorage.removeItem("openGroupOnLoad");
db.ref("userGroups/"+(myUid||"none")+"/"+openId).once("value",function(s){
var g=s.val()||{};
openGroup(openId,g.name||"Group");
});
}
}catch(e){}
})();
</script>
</body>
</html>
