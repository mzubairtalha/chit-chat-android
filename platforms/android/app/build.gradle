apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingDimensionActivityIntent'
    }
    
    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
    
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.gms:play-services-base:18.0.1'
            exclude group: 'com.google.android.gms', module: 'play-services-measurement-sdk-impl'
            exclude group: 'com.google.android.gms', module: 'play-services-measurement-sdk'
        }
    }
}

dependencies {
    // Use release version of play-services-ads that doesn't have color resource issues
    implementation('com.google.android.gms:play-services-ads:20.6.0') {
        exclude group: 'com.google.android.gms', module: 'play-services-measurement-sdk-impl'
    }
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
