<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>World Chat - Chit Chat</title>
<style>
:root{
  --navy:#0369A1;--navy2:#0284C7;--purple:#0EA5E9;
  --bg:#F0F9FF;--card:#FFFFFF;--border:#BAE6FD;
  --t1:#0C1A2E;--t2:#4B6280;--t3:#94A3B8;
  --online-c:#10B981;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
#wcRoot{display:flex;flex-direction:column;height:100%;height:100dvh;}

#wcHeader{
  flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  box-shadow:0 3px 16px rgba(3,105,161,0.30);
  color:#fff;
}
#wcBackBtn{
  background:rgba(255,255,255,0.15);border:none;color:#fff;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;flex-shrink:0;
}
#wcHeaderText{flex:1;min-width:0;}
#wcTitle{font-size:16px;font-weight:700;line-height:1.25;}
#wcSubtitle{font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:1px;}

#wcMessages{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 12px 10px;min-height:0;
}
.wc-empty{text-align:center;color:var(--t3);font-size:13px;padding:40px 20px;}
.wc-row{display:flex;flex-direction:column;max-width:78%;margin-bottom:10px;}
.wc-row.me{margin-left:auto;align-items:flex-end;}
.wc-row.other{margin-right:auto;align-items:flex-start;}
.wc-name{font-size:11.5px;font-weight:700;margin:0 4px 3px;}
.wc-bubble{
  padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;
  word-wrap:break-word;white-space:pre-wrap;
}
.wc-row.me .wc-bubble{
  background:linear-gradient(135deg,var(--navy) 0%,var(--purple) 100%);
  color:#fff;border-bottom-right-radius:4px;
  box-shadow:0 4px 14px rgba(3,105,161,0.25);
}
.wc-row.other .wc-bubble{
  background:var(--card);color:var(--t1);
  border:1px solid var(--border);border-bottom-left-radius:4px;
}
.wc-time{font-size:10px;color:var(--t3);margin:3px 4px 0;}
.wc-row.me .wc-time{color:var(--t3);text-align:right;}

#wcInputRow{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--card);border-top:1px solid var(--border);
}
#wcInput{
  flex:1;border:1.5px solid var(--border);border-radius:22px;
  padding:10px 16px;font-size:14px;background:#F8FAFC;color:var(--t1);
  outline:none;resize:none;max-height:90px;line-height:1.4;
}
#wcInput::placeholder{color:var(--t3);}
#wcSendBtn{
  flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--navy) 0%,var(--purple) 100%);
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 3px 10px rgba(3,105,161,0.35);
}
#wcSendBtn:disabled{opacity:0.5;}
#wcStatusBar{
  flex-shrink:0;text-align:center;font-size:11px;color:var(--t3);
  padding:6px;background:var(--bg);display:none;
}
.loading-spinner{
  display:inline-block;width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(3,105,161,0.25);border-top-color:var(--navy);
  animation:wcspin 0.7s linear infinite;vertical-align:middle;margin-right:6px;
}
@keyframes wcspin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="wcRoot">
  <div id="wcHeader">
    <button id="wcBackBtn" title="Back">←</button>
    <div id="wcHeaderText">
      <div id="wcTitle">🌍 World Chat</div>
      <div id="wcSubtitle">Public room — everyone on Chit Chat can see this</div>
    </div>
  </div>
  <div id="wcMessages"><div class="wc-empty"><span class="loading-spinner"></span>Loading world chat...</div></div>
  <div id="wcStatusBar"></div>
  <div id="wcInputRow">
    <textarea id="wcInput" rows="1" maxlength="500" placeholder="Message the world..."></textarea>
    <button id="wcSendBtn">➤</button>
  </div>
</div>

<script src="js/firebase-app.js"></script>
<script src="js/firebase-database.js"></script>
<script src="js/firebase-auth.js"></script>
<script>
(function(){
"use strict";

var firebaseConfig={
apiKey: "AIzaSyBiiVHsi_vdIR9w2wyTvQMpCXMltVGTAsM",
authDomain: "chit-chat-84a92.firebaseapp.com",
databaseURL: "https://chit-chat-84a92-default-rtdb.firebaseio.com",
projectId: "chit-chat-84a92",
storageBucket: "chit-chat-84a92.firebasestorage.app",
messagingSenderId: "435993972654",
appId: "1:435993972654:web:5c9a5af5dc60628693823f",
measurementId: "G-HVQG8SQVG1"
};
if(!firebase.apps||!firebase.apps.length){
firebase.initializeApp(firebaseConfig);
}
var db=firebase.database();

var myUid=localStorage.getItem("uid")||null;
var myUsername=localStorage.getItem("username")||null;

var wcMessages=document.getElementById("wcMessages");
var wcInput=document.getElementById("wcInput");
var wcSendBtn=document.getElementById("wcSendBtn");
var wcBackBtn=document.getElementById("wcBackBtn");
var wcStatusBar=document.getElementById("wcStatusBar");
var wcSubtitle=document.getElementById("wcSubtitle");

// Hide the back button when embedded inside the Android tab iframe —
// the tab bar itself already lets you switch away. Only show it when
// this page was opened as a full standalone page (dropdown "World Chat").
var embedded=false;
try{embedded=(window.self!==window.top);}catch(e){embedded=true;}
if(embedded){
wcBackBtn.style.display="none";
}else{
wcBackBtn.onclick=function(){window.location.href="index.html";};
}

function escapeHtml(s){
return String(s==null?"":s)
.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function formatTime(ts){
if(!ts)return "";
var d=new Date(ts);
var h=d.getHours(),m=d.getMinutes();
var ampm=h>=12?"PM":"AM";
h=h%12; if(h===0)h=12;
return h+":"+(m<10?"0"+m:m)+" "+ampm;
}
// Deterministic-ish colour per sender name so the same person always
// gets the same colour in the room.
var NAME_COLORS=["#0369A1","#7C3AED","#DB2777","#059669","#D97706","#DC2626","#0891B2","#4338CA"];
function colorForName(name){
var h=0;
for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
return NAME_COLORS[h%NAME_COLORS.length];
}

var isFirstLoad=true;
var renderedKeys={};

function isNearBottom(){
return (wcMessages.scrollHeight-wcMessages.scrollTop-wcMessages.clientHeight)<120;
}

function renderMessage(key,data,scrollDown){
if(renderedKeys[key])return;
renderedKeys[key]=true;
if(wcMessages.querySelector(".wc-empty")){wcMessages.innerHTML="";}
var isMe=!!(myUid&&data.uid===myUid);
var row=document.createElement("div");
row.className="wc-row "+(isMe?"me":"other");
row.dataset.key=key;
if(!isMe){
var nameEl=document.createElement("div");
nameEl.className="wc-name";
nameEl.style.color=colorForName(data.username||"User");
nameEl.textContent=data.username||"User";
row.appendChild(nameEl);
}
var bubble=document.createElement("div");
bubble.className="wc-bubble";
bubble.textContent=data.message||"";
row.appendChild(bubble);
var timeEl=document.createElement("div");
timeEl.className="wc-time";
timeEl.textContent=formatTime(data.timestamp);
row.appendChild(timeEl);
var wasNearBottom=isNearBottom();
wcMessages.appendChild(row);
if(scrollDown||wasNearBottom||isFirstLoad){
wcMessages.scrollTop=wcMessages.scrollHeight;
}
}

var messagesRef=db.ref("worldChat/messages").orderByChild("timestamp").limitToLast(100);
var loadTimeout=setTimeout(function(){
if(isFirstLoad&&wcMessages.querySelector(".wc-empty")){
wcMessages.innerHTML='<div class="wc-empty">No messages yet — say hi to everyone! 👋</div>';
}
},4000);

messagesRef.on("child_added",function(snap){
clearTimeout(loadTimeout);
renderMessage(snap.key,snap.val()||{},false);
isFirstLoad=false;
});

messagesRef.once("value",function(){
clearTimeout(loadTimeout);
isFirstLoad=false;
if(wcMessages.querySelector(".wc-empty")){
wcMessages.innerHTML='<div class="wc-empty">No messages yet — say hi to everyone! 👋</div>';
}
wcMessages.scrollTop=wcMessages.scrollHeight;
});

// Keep our own displayed username fresh (in case it was edited from the
// main app since this iframe/tab was first loaded).
function refreshMyUsername(){
if(!myUid)return;
db.ref("users/"+myUid).once("value",function(snap){
var u=snap&&snap.val();
if(u&&u.username)myUsername=u.username;
}).catch(function(){});
}
refreshMyUsername();

var sending=false;
function sendMessage(){
if(sending)return;
var text=(wcInput.value||"").trim();
if(!text)return;
if(!myUid){
wcStatusBar.style.display="block";
wcStatusBar.textContent="Please log in to Chit Chat first.";
return;
}
sending=true;
wcSendBtn.disabled=true;
var newRef=db.ref("worldChat/messages").push();
newRef.set({
uid: myUid,
username: myUsername||"User",
message: text.substring(0,500),
timestamp: Date.now()
}).then(function(){
wcInput.value="";
wcInput.style.height="auto";
}).catch(function(){
wcStatusBar.style.display="block";
wcStatusBar.textContent="Message failed to send. Check your connection.";
setTimeout(function(){wcStatusBar.style.display="none";},3000);
}).finally(function(){
sending=false;
wcSendBtn.disabled=false;
wcInput.focus();
});
}

wcSendBtn.onclick=sendMessage;
wcInput.addEventListener("keydown",function(e){
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});
wcInput.addEventListener("input",function(){
wcInput.style.height="auto";
wcInput.style.height=Math.min(wcInput.scrollHeight,90)+"px";
});

if(!myUid){
wcSubtitle.textContent="Log in to Chit Chat to join the conversation";
wcInput.disabled=true;
wcInput.placeholder="Log in to send a message...";
wcSendBtn.disabled=true;
}

// Watch how many distinct people have posted in the last few minutes as a
// light "active now" indicator — purely cosmetic, best-effort only.
db.ref("worldChat/messages").orderByChild("timestamp").limitToLast(50).once("value",function(snap){
var seen={};var count=0;
var cutoff=Date.now()-10*60*1000;
snap.forEach(function(c){
var v=c.val()||{};
if(v.timestamp>cutoff&&v.uid&&!seen[v.uid]){seen[v.uid]=true;count++;}
});
if(count>0){
wcSubtitle.textContent=count+" active in the last 10 min";
}
}).catch(function(){});

})();
</script>
</body>
</html>
